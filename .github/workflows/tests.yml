# Runs the app's checks and tests on every push and pull request.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          node --check app.js
          node --check adapters.js
          node --check intros.js
          node --check sw.js
      - name: Storage tests
        run: node --test tests/storage.test.cjs
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: |
          python -m http.server 8000 --bind 127.0.0.1 &
          sleep 1
          export STUDY_TEST_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')"
          python -m unittest discover -s tests -v
